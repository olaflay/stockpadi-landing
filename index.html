<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/hero-merchant-phone.webp" as="image" type="image/webp" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Static fallback head. Route-specific title/meta/canonical/OG/Twitter/JSON-LD
         are baked at build time by vite.config.ts (static-seo-prerender) and kept in
         sync at runtime by DynamicJsonLd — both consume src/seo/seo.ts. -->
    <!-- SEO_HEAD_START -->
    <title>Retail POS &amp; Inventory Management</title>
    <meta name="title" content="Retail POS &amp; Inventory Management" />
    <meta
      name="description"
      content="After setup, record core sales during an outage, track inventory movements, manage customer credit, and share digital receipts."
    />
    <meta
      name="keywords"
      content="offline pos software, retail inventory management app, whatsapp digital receipts, customer debt book ledger, multi-branch retail software"
    />
    <!-- SEO_HEAD_END -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101314" />

    <!-- iOS / PWA Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
