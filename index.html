<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Static fallback head. Route-specific title/meta/canonical/OG/Twitter/JSON-LD
         are baked at build time by vite.config.ts (static-seo-prerender) and kept in
         sync at runtime by DynamicJsonLd — both consume src/seo/seo.ts. -->
    <title>OjàPadi: Offline-First Retail POS, Inventory Management & Receipt Printing</title>
    <meta name="title" content="OjàPadi: Offline-First Retail POS, Inventory Management & Receipt Printing" />
    <meta
      name="description"
      content="Record sales, track inventory, manage customer credit, and print wireless Bluetooth receipts without internet. The 100% offline-first POS platform built for retail businesses and multi-branch stores."
    />
    <meta
      name="keywords"
      content="offline pos software, retail inventory management app, bluetooth thermal receipt printer, customer debt book ledger, multi-branch retail software"
    />
    <meta name="author" content="OjaPadi Technologies" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101314" />

    <!-- iOS / PWA Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OjàPadi" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Typography: Plus Jakarta Sans & Roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- SEO_HEAD -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
